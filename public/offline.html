<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0d1117" />
    <title>أنت غير متصل بالإنترنت — WekiCode</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #0d1117; color: #e6edf3; padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      }
      .card {
        max-width: 440px; width: 100%; text-align: center;
        background: #131a23; border: 1px solid #232c38; border-radius: 20px; padding: 32px 24px;
      }
      .badge {
        width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 18px;
        background: linear-gradient(135deg, #1f6feb, #2ea043);
        display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; color: #fff;
      }
      h1 { font-size: 20px; margin: 0 0 10px; }
      p { font-size: 14px; line-height: 1.9; color: #9aa7b4; margin: 0 0 22px; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      a, button {
        font: inherit; cursor: pointer; border-radius: 12px; padding: 10px 18px;
        border: 1px solid #2b3644; background: #1a222c; color: #e6edf3; text-decoration: none;
      }
      .primary { background: linear-gradient(135deg, #1f6feb, #2ea043); border-color: transparent; color: #fff; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">WC</div>
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>
        بعض صفحات WekiCode المحفوظة يمكن قراءتها بدون اتصال.
        أعد الاتصال لتحديث النقاشات والإشعارات.
      </p>
      <div class="actions">
        <a class="primary" href="/">العودة للرئيسية</a>
        <a href="/saved-offline">المحتوى المحفوظ</a>
        <button onclick="location.reload()">إعادة المحاولة</button>
      </div>
    </main>
  </body>
</html>
